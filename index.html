<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Create and manage your sticky notes online. A simple and intuitive note-taking app to help you stay organized and focused. Access your notes from anywhere, anytime."
    />
    <meta
      name="keywords"
      content="sticky notes, online notes, note-taking app, organization, productivity, reminders, to-do lists"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sticky Notes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <meta
      name="google-site-verification"
      content="UO9CCAlmazwyAVOdNfr0YHw01mjBa-4L07FTNkljF_A"
    />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sticky Note" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="Notes.css" />
  </head>
  <body>
    <div class="app">
      <nav class="navbar" style="background-color: #e3f2fd">
        <div class="container-fluid">
          <a class="navbar-brand">Sticky Notes</a>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
              id="search"
            />
            <label for="search">
              <button class="btn btn-outline-success">Search</button></label
            >
          </form>
        </div>
      </nav>
      <div class="alert"></div>
      <h3 class="mainheading">
        Sticky Notes
        <small class="text-body-secondary">Store your notes here</small>
      </h3>
      <div class="textareadiv container">
        <input
          type="text"
          class="form-control mb-4"
          id="title"
          placeholder="Enter the title here"
        />
        <textarea
          class="form-control"
          id="notesarea"
          rows="3"
          placeholder="Enter the text here"
        ></textarea>
        <button
          type="button"
          class="btn btn-primary btn-lg my-2 mx-3"
          id="btnnotes"
        >
          Add Note
        </button>
        <button
          type="button"
          class="btn btn-warning btn-sm my-2 mx-2"
          id="removebtn"
        >
          Remove spaces
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm my-2 mx-2"
          id="capitalbtn"
        >
          Capital Letter
        </button>
        <button
          type="button"
          class="btn btn-danger btn-sm my-2 mx-2"
          id="smallbtn"
        >
          Small Letter
        </button>
        <button
          type="button"
          class="btn btn-outline-dark btn-sm my-2 mx-2"
          id="firstletter"
        >
          Sentence Capital
        </button>
        <button
          type="button"
          class="btn btn-outline-dark btn-sm my-2 mx-2"
          id="clear"
        >
          Clear Text
        </button>
      </div>
      <section class="notesadd"></section>
    </div>
    <footer class="footer">
      <div class="container">
        <h6 class="connect-title">Connect with Us</h6>
        <a
          href="https://www.asadkhan.site/"
          target="_blank"
          class="portfolio-link"
          title="Go to my Portfolio"
        >
          <i class="github-icon"></i>
          <img
            class="image"
            src="https://res.cloudinary.com/diinrpqko/image/upload/w_1000,c_fill,ar_1:1,g_auto,r_max,bo_5px_solid_red,b_rgb:262c35/v1721721299/Profile-picture/dpqqqt7xitjjj1upajp8.png"
            alt=""
          />
        </a>
        <div class="credit">
          <strong> Credit goes to Asad Khan </strong>
        </div>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="notes.js"></script>
  </body>
</html>
